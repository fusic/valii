version: 2.1

executors:
  php8_5:
    docker:
      - image: cimg/php:8.5
  php8_4:
    docker:
      - image: cimg/php:8.4
  php8_3:
    docker:
      - image: cimg/php:8.3
  php8_2:
    docker:
      - image: cimg/php:8.2

commands:
  composer_install:
    steps:
      - checkout
      - run: php -v
      - run: sudo composer self-update
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.json" }}
      - run: composer install -n --prefer-dist
      - save_cache:
          key: composer-v1-{{ checksum "composer.json" }}
          paths:
            - vendor
      - run: vendor/bin/phpunit

jobs:
  php85:
    executor: php8_5
    steps:
      - composer_install
  php84:
    executor: php8_4
    steps:
      - composer_install
  php83:
    executor: php8_3
    steps:
      - composer_install
  php82:
    executor: php8_2
    steps:
      - composer_install

workflows:
  test:
    jobs:
      - php85
      - php84
      - php83
      - php82
